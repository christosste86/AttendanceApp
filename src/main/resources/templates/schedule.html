<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="../static/css/styles.css">
    <title>schedule</title>
</head>
<body>

<header>
    <nav th:replace="~{fragments/navbar :: bavigation-bar}"></nav>
</header>

<main>
    <h1>Employees Schedule</h1>

    <div class = "schedule">
        <form th:action = "@{/month-list/}" method="get">
            <label for="daymonth">Select month:</label>
            <input type="month" id="daymonth" name="month">
            <input type="submit">
        </form>

        <form th:action="@{/employee-filter/}" method="get">
            <label for="filteredFirstName">First name: </label>
            <input type="text" id="filteredFirstName" name="firstName">

            <label for="filteredLastName">Last name: </label>
            <input type="text" id="filteredLastName" name="lastName">

            <label for="separateSelect">Seperated name:</label>
            <select name="separatedName" id="separateSelect" required>
                <option value="" disabled selected>Select Seperated</option>
                <option th:each="separate :${separatedList}" th:value="${separate.getId()}" th:text ="${separate.getTitle()}"></option>
            </select>

            <label for="positionSelect">Position name:</label>
            <select name="position" id="positionSelect" required>
                <option value="" disabled selected>Select position</option>
                <option th:each="position :${positionsList}" th:value="${position.getId()}" th:text ="${position.getTitle()}"></option>
            </select>
            <input type="submit">
        </form>

        <table class="tableBackground">
            <thead class="scheduleHeader">
            <tr>
                <th class= "thMonth" colspan="2" th:if="${selectedMonth != null}"
                    th:text="${selectedMonth.getMonth()}">
                    Month
                </th>
                <div th:each="day : ${daysOfMonth}" th:object="${day}">
                    <th class="thDays" th:text="${day.getDayOfMonth()}">
                        1
                    </th>
                </div>
                <th colspan="2"></th>
            </tr>

            <tr>
                <th class="thFulName">Employee</th>
                <th class="thPosition">Position</th>
                <div th:each ="dayOfWeek: ${selectedMonthDayWeekShort}" th:object="${dayOfWeek}">
                    <th th:classappend="${dayOfWeek.equals('Sat') || dayOfWeek.equals('Sun')?'weekDay' : 'thDaysOfWeek'}"
                        th:text="${dayOfWeek}">
                        1
                    </th>
                </div>
                <th class ="thDetails">Hours</th>
                <th class ="thDetails">Shifts</th>
            </tr>

            </thead>
            <tbody class="scheduleBody">


            <div th:each = "employeeSchedule : ${monthlyEmployeesSchedule}">

                <tr th:if="${employeeSchedule.key.getFirstName() != null && employeeSchedule.key.getLastName() != null}">

                    <td class="tdFulName" th:text ="${employeeSchedule.key.fullName}">Leonardo Dicaprio</td>

                    <td class="tdPosition" th:if ="${employeeSchedule.key.getPosition() != null}"
                        th:text = "${employeeSchedule.key.getPosition().getSortTitle()}">Manager</td>

                    <td th:if ="${employeeSchedule.key.getPosition() == null}"
                        th:text = "${'No Set'}"></td>

                    <div th:each="eSchedule, status : ${employeeSchedule.value}" th:object="${eSchedule}">

<!--days button if is empty-->
                        <td th:if="${eSchedule.getShiftStart() == null}">

                            <form method="get" th:action="@{/select-employee/{employeeUsername}/select-day/{dayOfMonth} (dayOfMonth = ${status.index+1}, employeeUsername =${employeeSchedule.key.getUsername()})}">
                                <button class="tdButtonEmpty" type="submit"></button>
                            </form>

                        </td>
<!--days button if is not empty-->
                        <td th:if="${eSchedule.getShiftStart() != null}">
                            <form method="get"
                                  th:action="@{/select-employee/{employeeUsername}/select-day/{dayOfMonth} (dayOfMonth = ${status.index+1}, employeeUsername =${employeeSchedule.key.getUsername()})}">
                                <button class="tdButtonMorning"
                                        type="submit"
                                        th:classappend="${eSchedule.getShiftEnd().getHour() > 16}?'tdButtonAfternoon':'tdButtonMorning'"
                                        th:text ="${eSchedule.getDailySchedule()}">14:00 20:00</button>
                            </form>
                        </td>
                    </div>
                    <div th:each="hours : ${monthlyEmployeesTotalHours}"
                         th:if="${hours.getKey() == employeeSchedule.getKey()}">
                        <td class ="tdDetails" th:text ="${hours.getValue().getTotalHours()} + '/' + ${hours.getValue().getMonthlyFullTimeHours()}"></td>
                        <td class ="tdDetails" th:text ="${hours.getValue().getShifts()}"></td>
                    </div>
                </tr>
            </div>
            </tbody>
        </table>
    </div>

    <!--                            add Schedule-->
    <div id="addSchedule" class="openAddSchedule">

        <div class = "topLine">
            <div class = "scheduleTitle">Add Schedule</div>
<!--            <button class="closeButton" onclick="closeAddSchedule()">X</button>-->
        </div>

        <div class="employeeDateSchedule">
            <div class = "addScheduleEmployee"
                 th:if="${selectedEmployee != null}"
                 th:text ="${selectedEmployee.getFullName()}">
                Firstname Lastname
            </div>

            <div class="addScheduleDate"
                 th:if="${selectedDay != null}"
                 th:text = "${selectedMonth.withDayOfMonth(selectedDay)}">
                2024-12-26
            </div>

        </div>

        <div class="formSchedule">

            <form th:action="@{/add-schedule}" method="post">
            <div>
                <div>Start Shift</div>
                <div class="time">
                    <label for="shiftStartHours"></label>
                    <input class="timeHours"
                           id="shiftStartHours"
                           type="number"
                           name="shiftStartHour"
                           value="00"
                           min="0" max="23" step="1">
                    <label for="shiftStartMinutes">:</label>
                    <input class="timeMinutes"
                           id="shiftStartMinutes"
                           type="number"
                           name="shiftStartMinutes"
                           value="00"
                           min="0" max="59" step="1">
                </div>
                <div>End Shift</div>
                <div class="time">
                    <label for="shiftEndHour"></label>
                    <input class="timeHours"
                           id="shiftEndHour"
                           type="number"
                           name="shiftEndHour"
                           value="00"
                           min="0" max="23" step="1">
                    <label for="shiftEndMinutes">:</label>
                    <input class="timeMinutes"
                           id="shiftEndMinutes"
                           type="number"
                           name="shiftEndMinutes"
                           value="00"
                           min="0" max="59" step="1">
                </div>
            </div>
            <div>
                <label for="isPresent">Present</label>
                <input id="isPresent"
                       type="checkbox"
                       name="isPresent"
                       th:value="true">
            </div>
            <button type="submit">Add Schedule</button>
        </form>
        </div>
    </div>
    <!--                            End Add Schedule-->
</main>
<script>
    function openAddSchedule() {
        var element = document.getElementById("addSchedule");
        if (element.classList.contains("hide")) {
            element.classList.remove("hide");
            element.classList.add("openAddSchedule");
        }
    }
    function hide() {
        var element = document.getElementById("addSchedule");
        element.classList.toggle("hide");
    }

    // Get the current date
    const now = new Date();
    // Format the date as "YYYY-MM"
    const currentMonth = now.toISOString().substring(0, 7);
    // Set the value of the input field
    document.getElementById("daymonth").value = currentMonth;
</script>
</body>
</html>
