<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="../static/css/styles.css">
    <meta charset="UTF-8">
    <title>Structure</title>
</head>
<body>
<header>
    <nav th:replace="~{fragments/navbar :: bavigation-bar}"></nav>
</header>
<main>
    <h1> Structure Schedule</h1>
    <div class="structure">
        <!--    Assignments-->
        <div class="structureBox">
            <h3 class="structureTitle">Assignments</h3>
            <div class ="structureOptions">
                <table class="optionTable">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Assignment</th>
                            <th>Update</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="assignment : ${assignmentList}" th:object="${assignment}">
                            <td th:text="${assignment.getAssignmentTitle()}">Title</td>
                            <td th:text="${assignment.getHoursPerWeek()}">Assignment</td>
                            <td>
                                <form th:action="@{/update-assignment/{id} (id = ${assignment.getId()})}">
                                    <button type = "submit">Update</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/delete-separate/{id}(id=${assignment.getId()})}">
                                    <button type = "submit">Remove</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class ="optionForum">
                    <form th:action="@{/add-assignment/}" method="post">
                        <div>
                            <label for="assignment_title">Title: </label>
                            <input type ="text" id="assignment_title" name="title">
                        </div>
                        <div>
                            <label for="assignmentHours">Assignment: </label>
                            <input type = "number" id="assignmentHours" name="assignment">
                        </div>
                        <button type="submit">Add assignment</button>
                    </form>
                </div>
            </div>
        </div>
    <!--    Position-->
        <div class="structureBox">
            <h3 class="structureTitle">Positions</h3>
            <div class ="structureOptions">
                <table class="optionTable">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Update</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="position : ${positionList}" th:object="${position}">
                            <td th:text="${position.getTitle()}">Title</td>
                            <td>
                                <form th:action="@{/update-position/{id} (id =${position.getId()})}">
                                    <button type="submit">Update</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/delete-position/{id}(id=${position.getId()})}">
                                    <button type="submit">Remove</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class ="optionForum">
                    <form th:action="@{/add-position/}" method="post">
                        <div>
                            <label for="position_title">Title: </label>
                            <input type ="text" id="position_title" name="title">
                        </div>
                        <button type="submit">Add position</button>
                    </form>
                </div>
            </div>
        </div>
        <!--    Separate-->
        <div class="structureBox">
            <h3 class ="structureTitle">Separates</h3>
            <div class="structureOptions">
                <table class="optionTable">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Update</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="separate : ${separateList}" th:object="${separate}">
                            <td th:text="${separate.getTitle()}">Title</td>
                            <td th:text="${separate.getDescription()}">Description</td>
                            <td>
                                <form th:action="@{/update-separate/{id}(id=${separate.getId()})}">
                                    <button type="submit">Update</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/delete-separate/{id}(id = ${separate.getId()})}">
                                    <button type="submit">Remove</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class ="optionForum">
                    <form th:action="@{/add-separate/}" method="post">
                        <div>
                            <label for="separate_title">Title: </label>
                            <input type ="text" id="separate_title" name="title">
                        </div>
                        <div>
                            <label for="separate_description">Assignment: </label>
                            <input type = "text" id="separate_description" name="description">
                        </div>
                        <button type="submit">Add separate</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


</main>
</body>
</html>
