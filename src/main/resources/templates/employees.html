<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="../static/css/styles.css">
    <title>Employees</title>
</head>
<body>
<header>
    <nav th:replace="~{fragments/navbar :: bavigation-bar}"></nav>
</header>
<main>
    <h1>All Employees</h1>
    <div class = "leftSize">
    <table th:if="${employees.size() > 0}">
        <thead>
        <tr>
            <th>Username</th>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Position</th>
            <th>Separate</th>
            <th>Assignment</th>
            <th>BenefitCard S/N</th>
            <th>About</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.getUsername()}"></td>
            <td th:text="${employee.getFirstName()}"></td>
            <td th:text="${employee.getLastName()}"></td>
            <td th:if="${employee.getPosition() != null}" th:text="${employee.getPosition().getTitle()}"></td>
            <td th:if="${employee.getPosition() == null}">Not set</td>
            <td th:if="${employee.getSeparate() != null}" th:text="${employee.getSeparate().getTitle()}"></td>
            <td th:if="${employee.getSeparate() == null}" >Not set</td>
            <td th:if="${employee.getAssignment() != null}" th:text="${employee.getAssignment().getHoursPerWeek()}"></td>
            <td th:if="${employee.getAssignment() == null}">Not set</td>
            <td th:if="${employee.getBenefitCard() != null}" th:text="${employee.getBenefitCard().getSerialNumber()}"></td>
            <td th:if="${employee.getBenefitCard() == null}">Not set</td>
            <td><a th:href="@{/about-employee/{employee}(employee=${employee.getId})}">About</a></td>
            <td>
                <form th:action="@{/get-employee-id-set-isUpdate-as-true/{id}(id = ${employee.getId()})}">
                    <button type="submit">Update</button>
                </form>
            </td>
            <td>
                <form method="get" th:action="@{/delete-employee/{id}(id=${employee.getId})}">
                    <button type = "submit">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
    <div class="rightSize">
<!--       ee-->
        <div id="updateEmployee">
            <div th:text="${isUpdate} ? 'Update Employee' : 'Add Employee'">Add/Update Employee</div>
            <form th:action="@{/add-update-employee}" method="post">
                <div>
                    <label for="update-username">Username: </label><br>
                    <input id="update-username" type="text" name ="username"
                           th:value="${username} ? ${username} : ''" ><br>

                    <label for="update-password">Password: </label><br>
                    <input id="update-password" type="password" name ="password"
                           th:value="${isUpdate} ? ${password} : ''"><br>
                </div>

                <div>
                    <label for="update-firstName">First name:</label><br>
                    <input id="update-firstName" type="text" placeholder=" " name="firstName"
                           th:value="${isUpdate} ? ${firstName} : ''"><br>


                    <label for="update-lastName">Last name:</label><br>
                    <input id="update-lastName" type="text" name="lastName"
                           th:value="${isUpdate} ? ${lastName} : ''"><br>

                    <label for="update-positionSelect">Position name:</label><br>
                    <select name="position" id="update-positionSelect" required><br>
                        <option
                                th:value="${isUpdate && employeeId != null}? ${position.id} :''"
                                th:disabled="${isUpdate == false} ? ${true} : ${false}"
                                th:text="${isUpdate && employeeId != null}? ${position.getTitle()} : 'Select Position'"
                                th:selected="true">
                            Select Seperated
                        </option>
                        <option th:each="position :${positionsList}"
                                th:value="${position.id}" th:text ="${position.getTitle()}"></option>
                    </select>
                    <br>
                    <label for="update-separateSelect">Seperated name:</label><br>
                    <select name="separate" id="update-separateSelect" required><br>
                        <option
                                th:value="${isUpdate && employeeId != null}? ${separate.id} :''"
                                th:disabled="${isUpdate == false} ? ${true} : ${false}"
                                th:text="${isUpdate && employeeId != null}? ${separate.getTitle()} : 'Select Seperated'"
                                th:selected="true">
                            Select Seperated
                        </option>
                        <option th:each="separate :${separatedList}" th:value="${separate.id}" th:text ="${separate.getTitle()}"></option>
                    </select>
                    <br>
                    <label for="update-assignmentSelect">Assignment:</label><br>
                    <select name="assignment" id="update-assignmentSelect" required><br>
                        <option
                                th:value="${isUpdate && employeeId != null}? ${assignment.id} :''"
                                th:disabled="${isUpdate == false} ? ${true} : ${false}"
                                th:text="${isUpdate && employeeId != null} ? ${assignment.hoursPerWeek} : 'Select Assignment'"
                                th:selected="true">
                            Select Seperated
                        </option>
                        <option th:each="assignment :${assignmentsList}"
                                th:value="${assignment.id}"
                                th:text ="${assignment.hoursPerWeek}"></option>
                    </select>
                    <br>
                    <label for="update-paymentPerHour">Payment: </label><br>
                    <input id="update-paymentPerHour" type="number" name="paymentPerHour"
                           th:value="${isUpdate} ? ${paymentPerHour} : ''"><span>/hour</span><br>
                </div>
                <button type="submit" th:text="${isUpdate} ? 'Update Employee' : 'Add Employee'">Update employee</button>
            </form>
            <form th:action="@{/set-isUpdate-as-False}">
                <div th:if="${isUpdate}">
                    <button type ="submit">Add</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script>
    function openUpdateEmployee() {
        var updateElement = document.getElementById("updateEmployee");
        var addElement = document.getElementById("addEmployee");
        if (updateElement.classList.contains("hide")) {
            updateElement.classList.remove("hide");
            addElement.classList.remove("openEmployee");
            addElement.classList.add("hide");
            updateElement.classList.add("openEmployee");
        }
    }
    function hide() {
        var updateElement = document.getElementById("updateEmployee");
        var addElement = document.getElementById("addEmployee");
        element.classList.toggle("hide");
    }
</script>
</body>
</html>
